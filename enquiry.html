<!-- ENQUIRY SECTION -->


<section class="enquiry-section">


<div class="enquiry-header">


<h1>
Enroll With Medcom
</h1>


<p>
Start your journey with practical,
career-focused training programs.
</p>


</div>




<div class="enquiry-box">



<h2>
Course Enquiry
</h2>


<p>
Fill in your details and our team will contact you shortly.
</p>




<form id="enquiry-form">


<input 
type="text"
name="from_name"
placeholder="Full Name *"
required>



<input
type="tel"
name="from_phoneno"
placeholder="Phone Number *"
required>



<input
type="email"
name="from_email"
placeholder="Email Address *"
required>




<select
name="course"
required>


<option value="" disabled selected>
Select Course
</option>


<option value="Tally Prime with GST">
Tally Prime with GST
</option>


<option value="Manual Accounting">
Manual Accounting
</option>


<option value="MS Office">
MS Office
</option>


<option value="Microsoft Excel">
Microsoft Excel
</option>


<option value="PowerPoint">
PowerPoint
</option>


</select>




<textarea
name="from_message"
placeholder="Your Message">
</textarea>




<button type="submit">
Submit Enquiry
</button>


</form>


</div>




<div class="benefits">


<div>
✓ Practical Training
</div>


<div>
✓ Industry Skills
</div>


<div>
✓ Career Growth
</div>


</div>



</section>
