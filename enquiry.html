</head>


<body>


<nav>

<div class="logo">

<img src="images/medcom_website_logo.png">

</div>


<ul>

<li><a href="index.html">Home</a></li>

<li><a href="courses.html">Courses</a></li>

</ul>


<a href="enquiry.html" class="nav-btn">

</a>


</nav>




<section class="enquiry-section">


<div class="enquiry-box">


<h1>
Start Your Learning Journey
</h1>


<p>
Fill in your details and our team will contact you shortly.
</p>



<form>


<input type="text" name="from_name" placeholder="Full Name" required>


<input type="tel" name="from_phoneno" placeholder="Phone Number" required>


<input type="email" name="from_email" placeholder="Email Address">


<div class="course-selection">

<label>Select Course(s)</label>


<!-- ACCOUNTING -->

<details>

<summary>
📚 Accounting & Finance
</summary>


<div class="course-options">


<label>
<input 
type="checkbox" 
name="course[]" 
value="Tally Prime with GST"
required>

Tally Prime with GST

</label>



<label>
<input 
type="checkbox" 
name="course[]" 
value="Manual Accounting">

Manual Accounting

</label>


</div>


</details>



<!-- OFFICE -->


<details>

<summary>
💻 Office & Productivity
</summary>


<div class="course-options">


<label>

<input 
type="checkbox" 
name="course[]" 
value="MS Office">

MS Office

</label>




<label>

<input 
type="checkbox" 
name="course[]" 
value="Microsoft Excel">

Microsoft Excel

</label>




<label>

<input 
type="checkbox" 
name="course[]" 
value="PowerPoint">

PowerPoint

</label>


</div>


</details>


</div>


<textarea placeholder="Your Message" name="from_message"></textarea>



<button type="submit">
Submit Enquiry
</button>


</form>


</div>


</section>



</body>

</html>
